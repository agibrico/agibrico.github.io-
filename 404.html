<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>AGB vCard Studio</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect logic
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathname = l.pathname;
      
      // Match public card ID if accessed directly via /q/ID or /c/ID
      var qMatch = pathname.match(/\/(?:c|q|card)\/([a-zA-Z0-9_-]+)/i);
      if (qMatch && qMatch[1]) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#q/' + qMatch[1]
        );
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    Redirection vers la carte connectée...
  </body>
</html>
